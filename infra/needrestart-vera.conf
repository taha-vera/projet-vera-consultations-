# /etc/needrestart/conf.d/vera.conf -- le service API n'est JAMAIS relance automatiquement.
#
# POURQUOI (audit d'exposition du 15/11/2026). Le 15/11/2026 a 06:00:53,
# `unattended-upgrade` a mis a jour libc6 ; treize secondes plus tard, tous les services
# du serveur ont ete arretes puis relances, vera-consultation comprise. Une
# consultation ouverte aurait perdu ses sessions RH sans que personne l'ait decide
# (LIMITS.md, section 12). Les mises a jour de securite continuent d'etre INSTALLEES
# automatiquement ; seul le redemarrage de ce service est differe.
#
# CE QUE CELA COUTE. Tant que le service n'est pas relance a la main, il garde en
# memoire l'ancienne version des bibliotheques mises a jour. Apres chaque mise a jour
# systeme, hors consultation : `needrestart -b`, puis `systemctl restart vera-consultation`.
# Voir PROCEDURE_REPRISE_VERA.md, « Mises a jour du systeme ».
#
# Installation : cp infra/needrestart-vera.conf /etc/needrestart/conf.d/vera.conf
# Controle     : needrestart -b   (aucune ligne « Error parsing »)
$nrconf{override_rc}->{qr(^vera-consultation\.service$)} = 0;
