# /etc/ssh/sshd_config.d/10-vera-durcissement.conf
#
# Accès SSH par clé uniquement. Posé le 20/10/2026 sur le serveur de production.
#
# Pourquoi un fichier à part, nommé « 10- » : sur Ubuntu/Hetzner,
# /etc/ssh/sshd_config.d/50-cloud-init.conf (géré par cloud-init) contient
# « PasswordAuthentication yes ». OpenSSH retient la PREMIÈRE valeur lue, et
# l'Include des fichiers annexes précède les réglages du fichier principal :
# écrire « PasswordAuthentication no » dans sshd_config seul serait sans effet.
# L'ordre alphabétique place ce fichier avant le 50-.
#
# À poser seulement APRÈS avoir vérifié qu'une connexion par clé fonctionne
# (ssh -o PasswordAuthentication=no root@<serveur> true), puis :
#   sshd -t && sshd -T | grep -E '^(passwordauthentication|permitrootlogin) '
#   systemctl reload ssh
# en gardant une session ouverte pendant le test d'une seconde connexion.
PasswordAuthentication no
PermitRootLogin prohibit-password
