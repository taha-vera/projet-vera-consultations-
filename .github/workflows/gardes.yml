name: Gardes structurelles

# POURQUOI CE WORKFLOW EXISTE
#
# Deux fuites identiques ont ete introduites a six jours d'intervalle : une
# route ajoutee au parcours de vote sans le bloc nginx correspondant, laissant
# IP et horodatage pour chaque votant. La seconde fois, un test avait ete ecrit
# pour empecher la recidive -- mais rien ne l'executait. Il ne tournait que si
# quelqu'un lancait run_tests.sh a la main, c'est-a-dire exactement la
# discipline qui avait deja echoue deux fois.
#
# Les tests rassembles ici verifient des invariants STRUCTURELS : ils lisent
# des fichiers du depot et comparent, sans base de donnees, sans module Rust,
# sans opendp. Ils tournent donc sur n'importe quel Python, en quelques
# secondes, a chaque push.
#
# Les tests fonctionnels (persistance, cryptographie, calibration DP) restent
# dans run_tests.sh, sur le serveur : ils exigent le module PyO3 compile et
# opendp, qu'on ne reconstruit pas ici.

on: [push, pull_request]

# PERMISSIONS MINIMALES, explicitement.
#
# Sans ce bloc, le jeton fourni au workflow herite des permissions par defaut du
# depot -- historiquement en ecriture. Ces gardes ne font que LIRE le code : un
# jeton en ecriture n'a aucune raison d'exister ici, et une action tierce
# compromise l'utiliserait. `codeql.yml` en avait un, pas celui-ci -- releve par
# un audit externe le 04/09/2026.
permissions:
  contents: read

jobs:
  gardes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # HISTORIQUE COMPLET, requis par l'etape de balayage de secrets
          # plus bas. Un premier correctif (09/09, matin) pretendait l'avoir
          # branche ici mais n'ecrivait que le commentaire plus bas -- deux
          # ecritures successives sur la meme variable Python, la seconde
          # ecrasant la premiere sans jamais reassigner la chaine modifiee.
          # Un audit externe l'a trouve en clonant le commit pousse et en
          # cherchant `with:` a cote de `fetch-depth`, pas seulement le mot
          # dans un commentaire. Corrige reellement le 09/09, soir.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Chaque requete que la page de vote declenche doit avoir son bloc
      # `location =` avec `access_log off` dans la configuration nginx.
      # Ajouter un appel reseau sans ajouter le bloc fait echouer ce job.
      - name: Routes du parcours de vote non journalisees
        run: python3 tests/test_routes_non_journalisees.py

      # La configuration servie doit interdire que les deux registres --
      # jetons emis et votes deposes -- se retrouvent dans un meme journal.
      # Ce test-la exige une base : on ne verifie ici que la declaration du
      # mode de journalisation dans le code, ce qui suffit a detecter un
      # retour a WAL par inadvertance.
      - name: Mode de journalisation SQLite
        run: |
          if grep -q 'PRAGMA journal_mode=WAL' vera_persistance.py; then
            echo "ECHEC : journal_mode=WAL detecte dans vera_persistance.py."
            echo ""
            echo "En WAL, le journal survit entre les transactions. La"
            echo "consommation d'un jeton (qui porte l'identite via la liste de"
            echo "l'organisation) et l'increment du compteur de reponses"
            echo "s'ecrivent alors dans le meme fichier, a quelques"
            echo "millisecondes d'intervalle : un lecteur du seul journal"
            echo "apparie qui a repondu quoi."
            echo ""
            echo "Voir test_registres_disjoints.py et le commentaire de"
            echo "_connexion() dans vera_persistance.py."
            exit 1
          fi
          echo "OK : aucun journal_mode=WAL."

      # Les empreintes publiees dans VERIFICATION_CLIENT.md doivent decrire
      # les fichiers du depot, et l'attribut integrity de la page de vote doit
      # correspondre au bundle. Le 22/08, un correctif a modifie vote.html sans
      # que le document suive : pendant sept jours, la procedure du README
      # produisait une divergence chez tout tiers qui l'appliquait -- le signal
      # meme d'un client modifie, emis a tort par le mecanisme de detection.
      - name: Empreintes publiees a jour
        run: python3 tests/test_empreintes_publiees.py

      # AUCUN script du depot n'emprunte le repli en clair VERA_ADMIN_PASS.
      #
      # La premiere version de cette garde ne nommait que run_tests.sh. C'etait
      # fermer le CAS et non la CLASSE : quatre scripts shell utilisaient le
      # repli, et deux sont restes casses -- crash_test.sh, que run_tests.sh
      # presente comme le test le plus complet de la suite, et charge_paliers.sh.
      # Elle porte desormais sur tous les .sh, presents et futurs.
      - name: Aucun script n'emprunte le repli en clair
        run: |
          FAUTIFS=$(grep -rlE '^[^#]*\bVERA_ADMIN_PASS[[:space:]]*=' \
                      --include='*.sh' . | grep -v '^\./\.git/' || true)
          if [ -n "$FAUTIFS" ]; then
            echo "ECHEC : ces scripts affectent VERA_ADMIN_PASS :"
            echo "$FAUTIFS"
            echo ""
            echo "L'API refuse de demarrer avec cette variable depuis le"
            echo "23/08. Ces scripts ne peuvent donc plus s'executer, et"
            echo "rien d'autre ne le signalerait. Voir LIMITS.md section 12."
            exit 1
          fi
          echo "OK : aucun script n'emprunte le repli."

      # Le bundle servi doit se reconstruire a l'identique depuis ses sources.
      # Sans ce controle, la chaine allait de l'empreinte publiee au fichier du
      # depot, jamais du fichier au code qui l'a produit : un bundle piege
      # commite tel quel passait tout.
      - name: Bundle reconstructible depuis ses sources
        run: |
          cd chantier_crypto && npm ci --silent && cd ..
          python3 tests/test_bundle_reconstructible.py

      # Aucun document ne doit contredire les parametres du code.
      # VERA_AUDIT_REFERENCE.md affichait journal_mode=WAL, 48 h de duree de cle
      # et un bourrage a 200 octets, des semaines apres que les trois eurent
      # change. Aucun test ne lisait la documentation.
      - name: Parametres documentes conformes au code
        run: python3 tests/test_parametres_documentes.py

      # LES GARDES QUI N'Y ETAIENT PAS.
      #
      # Relecture de notre propre travail, 27/08/2026 : trois gardes ecrites
      # cette semaine ne tournaient qu'a la demande, sur le serveur. Or leur
      # raison d'etre est de detecter une regression que personne ne cherche.
      # Une garde qui ne s'execute pas automatiquement ne garde qu'un jour.
      #
      # Celles-ci ne demandent ni base, ni module Rust, ni reseau.
      - name: Porte 7 -- le fail-closed se declenche
        run: python3 tests/test_porte7_failclosed.py

      - name: Porte 3 -- pas de canal temporel exploitable
        run: |
          pip install --quiet opendp==0.15.1   # MEME version que requirements.txt
          python3 tests/test_porte3_timing.py

      - name: Porte 2 -- inference d'appartenance sous la borne
        run: |
          pip install --quiet opendp==0.15.1   # MEME version que requirements.txt
          python3 tests/test_porte2_mia.py

      # AUCUN SECRET DANS L'HISTORIQUE, PAS SEULEMENT DANS L'ARBRE.
      #
      # La garde `test_repli_admin_retire.py` verifie l'arbre de travail. Un
      # audit externe a note le 04/09/2026 qu'elle ne dit rien des commits
      # passes -- or des secrets ont reellement fuite sur ce projet le
      # 31/07/2026, par le mot de passe en clair dans l'unite systemd.
      #
      # Un secret retire d'un fichier reste dans l'historique git, et un depot
      # public le rend consultable indefiniment. Le balayage du 04/09 sur les
      # 525 commits n'a rien trouve : cinq occurrences, toutes des constantes de
      # test explicites. Cette etape empeche que cela cesse d'etre vrai.
      #
      # fetch-depth: 0 est pose sur l'etape actions/checkout ci-dessus.
      - name: Aucun secret dans l'historique complet
        run: |
          git rev-list --count HEAD
          TROUVES=$(git log --all -p --format="" \
            | grep -inE "^\+.*(BEGIN [A-Z ]*PRIVATE KEY|VERA_DB_KEY=[0-9a-f]{16,}|[0-9a-f]{32}\\\$[0-9a-f]{64})" \
            || true)
          if [ -n "$TROUVES" ]; then
            echo "SECRET DANS L'HISTORIQUE :"
            echo "$TROUVES" | head -20
            echo ""
            echo "Un secret retire d'un fichier reste dans les commits."
            echo "Le revoquer, puis reecrire l'historique si le depot est public."
            exit 1
          fi
          if git log --all --diff-filter=A --name-only --format="" \
             | grep -qE "\.(db|env|key|pem)$"; then
            echo "Un fichier .db/.env/.key/.pem a ete versionne un jour."
            git log --all --diff-filter=A --name-only --format="" \
              | grep -E "\.(db|env|key|pem)$" | sort -u
            exit 1
          fi
          echo "Aucun secret ni fichier sensible dans l'historique."

      # Les fichiers Python doivent au moins compiler. Ne remplace pas la
      # suite de tests, mais attrape une erreur de syntaxe avant le serveur.
      - name: Compilation des modules
        run: python3 -m py_compile vera_*.py tests/test_*.py
